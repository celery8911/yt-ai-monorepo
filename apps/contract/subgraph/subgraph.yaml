specVersion: 0.0.5
description: yt-ai-monorepo automation subgraph (CBT/Escrow/DisputeDAO/AgentHiring)
repository: https://github.com/celery8911/yt-ai-monorepo
schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum/contract
    name: CBT
    network: sepolia
    source:
      address: "0x502BccF9d143ecB89983EdFbf107ebDeD3B9a9fc"
      abi: CBT
      startBlock: 10117975
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Wallet
        - Treasury
      abis:
        - name: CBT
          file: ./abis/CBT.json
      eventHandlers:
        - event: Minted(indexed address,uint256,uint256)
          handler: handleMinted
      file: ./src/mappings/cbt.ts

  - kind: ethereum/contract
    name: Escrow
    network: sepolia
    source:
      address: "0xd2a24326950A80272aCe018E2dcE25E22d5B5A7e"
      abi: Escrow
      startBlock: 10117975
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Escrow
      abis:
        - name: Escrow
          file: ./abis/Escrow.json
      eventHandlers:
        - event: PaymentCreated(indexed bytes32,address,address,uint256,uint256)
          handler: handlePaymentCreated
        - event: AutoReleaseScheduled(indexed bytes32,uint256)
          handler: handleAutoReleaseScheduled
        - event: AutoReleased(indexed bytes32,address,uint256)
          handler: handleAutoReleased
        - event: EscrowFrozen(indexed bytes32)
          handler: handleEscrowFrozen
        - event: EscrowRefunded(indexed bytes32,address,uint256)
          handler: handleEscrowRefunded
      file: ./src/mappings/escrow.ts

  - kind: ethereum/contract
    name: DisputeDAO
    network: sepolia
    source:
      address: "0x410756130fd06171298c72839FdCaB290Fe7eD16"
      abi: DisputeDAO
      startBlock: 10117975
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Dispute
        - Vote
      abis:
        - name: DisputeDAO
          file: ./abis/DisputeDAO.json
      eventHandlers:
        - event: DisputeOpened(indexed bytes32,indexed address,uint8)
          handler: handleDisputeOpened
        - event: VoteCast(indexed bytes32,indexed address,bool,uint256)
          handler: handleVoteCast
        - event: DisputeResolved(indexed bytes32,bool)
          handler: handleDisputeResolved
      file: ./src/mappings/dispute.ts

  - kind: ethereum/contract
    name: AgentHiring
    network: sepolia
    source:
      address: "0xf54EEa283A05A5dD10944404D088c65bB60552dA"
      abi: AgentHiring
      startBlock: 10117975
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Engagement
        - Transaction
      abis:
        - name: AgentHiring
          file: ./abis/AgentHiring.json
      eventHandlers:
        - event: EngagementCreated(indexed uint256,indexed address,string,indexed address,string,uint8,uint256)
          handler: handleEngagementCreated
        - event: PaymentReleased(indexed uint256,indexed address,uint256)
          handler: handlePaymentReleased
        - event: PaymentRefunded(indexed uint256,indexed address,uint256)
          handler: handlePaymentRefunded
      file: ./src/mappings/agent-hiring.ts
