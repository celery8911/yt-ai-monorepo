"""Wallet balances derived from on-chain events."""
type Wallet @entity(immutable: false) {
  id: ID!
  balance: BigInt!
  lockedAmount: BigInt!
  totalEarnings: BigInt!
  totalSpent: BigInt!
  updatedAt: BigInt!
}

"""Escrow record for a job payment."""
type Escrow @entity(immutable: false) {
  id: ID!
  jobId: Bytes!
  payer: Bytes!
  agent: Bytes!
  amount: BigInt!
  serviceFee: BigInt!
  currency: String!
  status: String!
  releaseAt: BigInt!
  createdAt: BigInt!
  releasedAt: BigInt
  refundedAt: BigInt
  frozen: Boolean!
}

"""Dispute lifecycle for an escrow."""
type Dispute @entity(immutable: false) {
  id: ID!
  jobId: Bytes!
  escrowId: ID!
  initiator: Bytes!
  status: String!
  votesFor: Int!
  votesAgainst: Int!
  totalVoters: Int!
  createdAt: BigInt!
  resolvedAt: BigInt
  resolvedOutcome: String
}

"""Vote entries for dispute participation."""
type Vote @entity(immutable: false) {
  id: ID!
  disputeId: ID!
  voter: Bytes!
  support: Boolean!
  cost: BigInt!
  createdAt: BigInt!
}

"""Treasury accounting for fees and ETH in."""
type Treasury @entity(immutable: false) {
  id: ID!
  ethCollected: BigInt!
  cbtFeesCollected: BigInt!
  updatedAt: BigInt!
}
